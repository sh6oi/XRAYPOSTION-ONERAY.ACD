<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>الموقع تحت الصيانة</title>
    <style>
        /* Reset & base */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0b0b0b;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 1.5rem;
            margin: 0;
        }

        /* Main card */
        .maintenance-card {
            max-width: 720px;
            width: 100%;
            background: #1a1a1a;
            border-radius: 2.5rem;
            padding: 3.5rem 2.5rem;
            text-align: center;
            border: 3px solid #f5c500;
            box-shadow: 0 20px 60px rgba(245, 197, 0, 0.15),
                0 0 0 1px rgba(245, 197, 0, 0.1) inset;
            position: relative;
            overflow: hidden;
            transition: transform 0.3s ease;
        }

        .maintenance-card:hover {
            transform: scale(1.01);
        }

        /* Decorative stripes */
        .maintenance-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: repeating-linear-gradient(45deg,
                    transparent,
                    transparent 20px,
                    rgba(245, 197, 0, 0.03) 20px,
                    rgba(245, 197, 0, 0.03) 40px);
            pointer-events: none;
            z-index: 0;
        }

        /* All content above the pseudo */
        .maintenance-card>* {
            position: relative;
            z-index: 1;
        }

        /* Icon / Gear */
        .icon-wrapper {
            display: inline-block;
            background: #f5c500;
            border-radius: 50%;
            padding: 1.5rem;
            margin-bottom: 1.8rem;
            box-shadow: 0 0 0 4px #1a1a1a, 0 0 0 7px #f5c500;
        }

        .icon-wrapper svg {
            display: block;
            width: 64px;
            height: 64px;
            fill: #0b0b0b;
        }

        /* Headline */
        h1 {
            font-size: 2.8rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: #f5c500;
            margin-bottom: 0.5rem;
            text-shadow: 0 0 20px rgba(245, 197, 0, 0.2);
        }

        /* Sub headline */
        .sub-headline {
            font-size: 1.15rem;
            font-weight: 500;
            color: #ffffff;
            margin-bottom: 1.8rem;
            line-height: 1.7;
            opacity: 0.9;
        }

        .sub-headline span {
            color: #f5c500;
            font-weight: 700;
        }

        /* Divider */
        .divider {
            width: 80px;
            height: 4px;
            background: #f5c500;
            margin: 1.5rem auto 1.8rem auto;
            border-radius: 4px;
        }

        /* Message body */
        .message {
            font-size: 1.05rem;
            color: #dddddd;
            line-height: 1.8;
            margin-bottom: 2.2rem;
            background: rgba(255, 255, 255, 0.04);
            padding: 1.2rem 1.8rem;
            border-radius: 1.2rem;
            border: 1px solid rgba(245, 197, 0, 0.15);
        }

        .message strong {
            color: #f5c500;
            font-weight: 700;
        }

        /* Status indicator */
        .status {
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            background: #f5c500;
            color: #0b0b0b;
            font-weight: 700;
            font-size: 0.9rem;
            padding: 0.6rem 1.6rem;
            border-radius: 40px;
            letter-spacing: 0.3px;
            text-transform: uppercase;
            margin-bottom: 1.5rem;
        }

        .status .dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            background: #0b0b0b;
            border-radius: 50%;
            animation: pulse-dot 1.6s ease-in-out infinite;
        }

        @keyframes pulse-dot {
            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.3;
                transform: scale(0.7);
            }
        }

        /* Progress bar */
        .progress-track {
            width: 100%;
            height: 6px;
            background: #2a2a2a;
            border-radius: 6px;
            overflow: hidden;
            margin-top: 0.8rem;
        }

        .progress-fill {
            height: 100%;
            width: 62%;
            background: linear-gradient(90deg, #f5c500, #ffdd33);
            border-radius: 6px;
            animation: progress-pulse 2.4s ease-in-out infinite;
        }

        @keyframes progress-pulse {
            0%,
            100% {
                width: 62%;
                opacity: 1;
            }
            50% {
                width: 78%;
                opacity: 0.8;
            }
        }

        /* Footer */
        .footer {
            margin-top: 2.2rem;
            font-size: 0.85rem;
            color: #888888;
            letter-spacing: 0.3px;
        }

        .footer a {
            color: #f5c500;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s;
        }

        .footer a:hover {
            color: #ffffff;
            text-decoration: underline;
        }

        /* Responsive */
        @media (max-width: 540px) {
            .maintenance-card {
                padding: 2.2rem 1.5rem;
                border-radius: 1.8rem;
            }

            h1 {
                font-size: 2rem;
            }

            .icon-wrapper {
                padding: 1rem;
            }

            .icon-wrapper svg {
                width: 44px;
                height: 44px;
            }

            .sub-headline {
                font-size: 1rem;
            }

            .message {
                font-size: 0.95rem;
                padding: 1rem 1.2rem;
            }

            .status {
                font-size: 0.8rem;
                padding: 0.5rem 1.2rem;
            }
        }

        @media (max-width: 400px) {
            h1 {
                font-size: 1.6rem;
            }
            .maintenance-card {
                padding: 1.8rem 1.2rem;
            }
        }
    </style>
</head>
<body>

    <div class="maintenance-card">

        <!-- Gear icon -->
        <div class="icon-wrapper">

            </svg>
        </div>

        <!-- Status badge -->
        <div class="status">
            <span class="dot"></span>
            جارٍ العمل على التحسين
        </div>

        <!-- Headline -->
        <h1>الموقع تحت الصيانة</h1>

        <!-- Sub headline -->
        <p class="sub-headline">
            نعمل على <span>تطوير</span> تجربتك &nbsp;·&nbsp; سنعود قريباً
        </p>

        <!-- Divider -->
        <div class="divider"></div>

        <!-- Message -->
        <div class="message">
            <strong>⚙️</strong> نعتذر عن الإزعاج، ولكننا نقوم حالياً
            <strong>بتحديث</strong> الموقع وإجراء تحسينات تقنية
            <strong>لخدمتك</strong> بشكل أفضل.<br />
            توقع عودتنا خلال <strong>ساعات</strong> قليلة.
        </div>

        <!-- Progress indicator -->
        <div class="progress-track">
            <div class="progress-fill"></div>
        </div>

        <!-- Footer -->
        <div class="footer">
            &nbsp;·&nbsp; شكراً لتفهمك
        </div>

    </div>

</body>
</html>
